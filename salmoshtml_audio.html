// ─── CHORD EDITOR ENGINE ────────────────────────────────────────────────────
// Estado global del editor de acordes en modo edición
const NOTAS_LIST = ['Do','Do#','Reb','Re','Re#','Mib','Mi','Fa','Fa#','Solb',
  'Sol','Sol#','Lab','La','La#','Sib','Si',
  'do','do#','reb','re','re#','mib','mi','fa','fa#','solb',
  'sol','sol#','lab','la','la#','sib','si'];
const ENARM_IDX = {
  'Do':0,'do':0,'Do#':1,'do#':1,'Reb':1,'reb':1,'Re':2,'re':2,
  'Re#':3,'re#':3,'Mib':3,'mib':3,'Mi':4,'mi':4,'Fa':5,'fa':5,
  'Fa#':6,'fa#':6,'Solb':6,'solb':6,'Sol':7,'sol':7,'Sol#':8,'sol#':8,
  'Lab':8,'lab':8,'La':9,'la':9,'La#':10,'la#':10,'Sib':10,'sib':10,'Si':11,'si':11
};
const IDX2N = {0:{M:'Do',m:'do'},1:{M:'Reb',m:'reb'},2:{M:'Re',m:'re'},
  3:{M:'Mib',m:'mib'},4:{M:'Mi',m:'mi'},5:{M:'Fa',m:'fa'},
  6:{M:'Fa#',m:'fa#'},7:{M:'Sol',m:'sol'},8:{M:'Lab',m:'lab'},
  9:{M:'La',m:'la'},10:{M:'Sib',m:'sib'},11:{M:'Si',m:'si'}};

function isNoteStr(t){ return Object.prototype.hasOwnProperty.call(ENARM_IDX,t); }

let ceState = { lines:[], antCount:0, sel:null }; // sel={li,ui}

// Inicializa ceState desde el salmo
function ceInit(s){
  const clines = chordLinesOf(s);
  const tlines = textLinesOf(s);
  const antCount = s.salmodia ? s.salmodia.split('\n').length : 0;
  const n = Math.max(clines.length, tlines.length);
  ceState.antCount = antCount;
  ceState.sel = null;
  ceState.lines = [];
  for(let i=0;i<n;i++){
    const cl = clines[i] || '';
    const tl = tlines[i] !== undefined ? tlines[i] : '';
    ceState.lines.push({ units: ceParseChordLine(cl), text: tl });
  }
}

// Parsea una línea de acordes en unidades {type:'note'|'space', note, minor, content}

// Descompone tokens fusionados tipo 'lam'->'la'+'m', 'fa#m'->'fa#'+'m', 'La7'->'La'+'7', etc.
// Orden importante: primero los más largos (Sol#, Solb, Fa#, etc.)
const FUSED_RE = /^(Do#|do#|Reb|reb|Re#|re#|Mib|mib|Fa#|fa#|Solb|solb|Sol#|sol#|Lab|lab|La#|la#|Sib|sib|Do|do|Re|re|Mi|mi|Fa|fa|Sol|sol|La|la|Si|si)(m)?(7)?$/;
function expandFusedToken(tok) {
  if (isNoteStr(tok)) return [tok]; // nota pura, sin sufijos pegados
  const m = tok.match(FUSED_RE);
  if (m && (m[2] || m[3])) {
    const out = [m[1]];
    if (m[2]) out.push('m');
    if (m[3]) out.push('7');
    return out;
  }
  return [tok];
}
// Expande todos los tokens de un array, descomponiendo los fusionados
function expandTokenArray(arr) {
  const out = [];
  for (const t of arr) {
    if (t === '\n') { out.push('\n'); continue; }
    for (const e of expandFusedToken(t)) out.push(e);
  }
  return out;
}
function ceParseChordLine(str){
  const units=[];
  // Tokenizar: secuencias de espacios o de no-espacios
  const rawToks = str.match(/ +|[^ ]+/g) || [];
  // Expandir tokens fusionados (lam->la+m, fa#m->fa#+m, etc.)
  const toks = [];
  for (const t of rawToks) {
    if (/^ +$/.test(t)) { toks.push(t); continue; }
    for (const e of expandFusedToken(t)) toks.push(e);
  }
  let i=0;
  while(i<toks.length){
    const t=toks[i];
    if(/^ +$/.test(t)){ units.push({type:'space',content:t}); i++; continue; }
    // ¿es nota? buscar si el siguiente token es 'm' y/o '7'
    if(isNoteStr(t)){
      let j = i+1, minor=false, seventh=false;
      if (j<toks.length && toks[j]==='m') { minor=true; j++; }
      if (j<toks.length && toks[j]==='7') { seventh=true; j++; }
      units.push({type:'note',note:t,minor,seventh});
      i = j;
    } else if(t==='m' && units.length && units[units.length-1].type==='note'){
      units[units.length-1].minor=true; i++;
    } else if(t==='7' && units.length && units[units.length-1].type==='note'){
      units[units.length-1].seventh=true; i++;
    } else {
      // texto suelto que no es nota → tratar como espacio textual
      units.push({type:'space',content:t}); i++;
    }
  }
  return units;
}

// Convierte units[] de una línea de vuelta a string de acordes
function ceLineToString(line){
  return line.units.map(u=>{
    if(u.type==='note') return u.note+(u.minor?'m':'')+(u.seventh?'7':'');
    return u.content;
  }).join('');
}

// ── Estado cursor de inserción: {li, afterUi} = insertar después de units[afterUi]
// afterUi=-1 significa al principio de la línea
let ceCursor = null; // {li, afterUi}

// Renderiza el chord editor dentro de #ce-wrap
function ceRender(){
  const wrap = document.getElementById('ce-wrap');
  if(!wrap) return;
  const NOTES_OPTS = ['Do','Do#','Reb','Re','Re#','Mib','Mi','Fa','Fa#','Solb',
    'Sol','Sol#','Lab','La','La#','Sib','Si',
    'do','do#','reb','re','re#','mib','mi','fa','fa#','solb',
    'sol','sol#','lab','la','la#','sib','si'];
  let html='';
  ceState.lines.forEach((line,li)=>{
    const isAnt = li < ceState.antCount;
    const isSel = ceState.sel && ceState.sel.li===li;
    const selUi = isSel ? ceState.sel.ui : -1;
    const selUnit = isSel ? line.units[selUi] : null;
    const hasCursor = ceCursor && ceCursor.li===li;

    html += `<div class="ce-block${isAnt?' is-ant':''}" data-li="${li}">`;

    // ── Fila de acordes ──
    html += `<div class="ce-chord-row">`;
    if(line.units.length===0){
      // Línea vacía: clic en toda la fila pone cursor al inicio
      const curHere = hasCursor ? '<span class="ce-cursor"></span>' : '';
      html+=`<span class="ce-tok sp" style="min-width:60px;cursor:text"
        onclick="ceSetCursor(${li},-1)">${curHere}<span style="color:#ccc;font-size:11px">— sin notas —</span></span>`;
    } else {
      line.units.forEach((u,ui)=>{
        if(u.type==='note'){
          const sel=isSel&&selUi===ui;
          const disp=u.note+(u.minor?'m':'')+(u.seventh?'7':'');
          html+=`<span class="ce-tok note${sel?' sel':''}"
            onclick="ceSelNote(${li},${ui})">${escHtml(disp)}</span>`;
        } else {
          // Espacio: dividir en caracteres individuales clicables
          // El cursor se coloca DESPUÉS del carácter en el que se hace clic
          const sp = u.content;
          // Calculamos el índice "after" que corresponde a insertar tras este token de espacio
          // Lo simplificamos: clic en cualquier parte del espacio = cursor después de este token
          const curAfter = hasCursor && ceCursor.afterUi===ui;
          html+=`<span class="ce-tok sp" style="cursor:text"
            onclick="ceSetCursor(${li},${ui})">${escHtml(sp)}${curAfter?'<span class="ce-cursor"></span>':''}</span>`;
        }
      });
      // Cursor al final (afterUi = units.length-1 cuando se hace clic tras el último)
      const curEnd = hasCursor && ceCursor.afterUi===line.units.length;
      if(curEnd) html+='<span class="ce-cursor"></span>';
    }
    html+=`<button class="btn-deline" onclick="ceDelLine(${li})"
      style="float:right;margin-top:1px" title="Borrar línea completa">✕fila</button>`;
    html+=`</div>`;

    // ── Texto editable ──
    html+=`<input class="ce-text-input" value="${escAttr(line.text)}"
      placeholder="${isAnt?'Antífona...':'Texto del salmo...'}"
      oninput="ceState.lines[${li}].text=this.value">`;

    // ── Notebar inline (solo si hay nota seleccionada en esta línea) ──
    const nbVis = (isSel && selUnit && selUnit.type==='note') ? ' vis' : '';
    const nbNote = selUnit&&selUnit.type==='note' ? selUnit.note : '';
    const nbMinor = selUnit&&selUnit.type==='note' ? selUnit.minor : false;
    const nbSeventh = selUnit&&selUnit.type==='note' ? selUnit.seventh : false;
    const opts = NOTES_OPTS.map(n=>`<option${n===nbNote?' selected':''}>${n}</option>`).join('');
    html+=`<div class="ce-notebar-inline${nbVis}" id="ce-nb-${li}">
      <button class="btn-mv"
        onmousedown="ceMoveRepeatStart(-1,event)"
        onmouseup="ceMoveRepeatStop()"
        onmouseleave="ceMoveRepeatStop()">◀</button>
      <button class="btn-mv"
        onmousedown="ceMoveRepeatStart(1,event)"
        onmouseup="ceMoveRepeatStop()"
        onmouseleave="ceMoveRepeatStop()">▶</button>
      <label>Nota:</label>
      <select onchange="ceChangeNote(this.value)">${opts}</select>
      <select onchange="ceChangeMinor(this.value==='1')">
        <option value="0"${!nbMinor?' selected':''}>Mayor</option>
        <option value="1"${nbMinor?' selected':''}>menor m</option>
      </select>
      <label style="margin-left:6px"><input type="checkbox" onchange="ceChangeSeventh(this.checked)"${nbSeventh?' checked':''}> 7ª (7)</label>
      <button class="btn-mv del" onclick="ceDelNote()" title="Eliminar esta nota">✕nota</button>
      <button class="btn-mv" onclick="ceDesel()" style="margin-left:4px">desel</button>
    </div>`;

    // ── Fila añadir nota ──
    // Muestra dónde se insertará
    const insertHint = hasCursor ? `tras pos.${ceCursor.afterUi+1}` :
      (isSel && selUnit && selUnit.type==='note') ? 'tras nota sel.' : 'al final';
    html+=`<div class="ce-addrow">
      <input type="text" placeholder="Sol m / Fa#" id="ce-nadd-${li}"
        onkeydown="if(event.key==='Enter')ceAddNote(${li})">
      <button onclick="ceAddNote(${li})">+nota</button>
      <button onclick="ceAddSpace(${li})">+esp</button>
      <button onclick="ceTrimLine(${li})" title="Fusiona espacios seguidos y quita el sobrante del final">🧹 limpiar espacios</button>
      <span style="font-size:10px;color:#aaa;margin-left:4px">${insertHint}</span>
    </div>`;

    html+=`</div>`;
  });
  wrap.innerHTML=html;
}

// Recorta espacios acumulados: fusiona unidades 'space' consecutivas en una sola,
// quita las de longitud 0, y si la línea termina en espacio (tras la última nota)
// lo deja como mucho en un espacio. No toca notas ni su orden.
function ceTrimLine(li){
  const units=ceState.lines[li].units;
  const merged=[];
  for(const u of units){
    if(u.type==='space'){
      if(merged.length && merged[merged.length-1].type==='space'){
        merged[merged.length-1]={type:'space',content:merged[merged.length-1].content+u.content};
      } else if(u.content.length>0){
        merged.push({...u});
      }
    } else {
      merged.push(u);
    }
  }
  // recortar espacio final sobrante (deja como mucho 1 si existe)
  if(merged.length && merged[merged.length-1].type==='space'){
    merged[merged.length-1]={type:'space',content:' '};
  }
  ceState.lines[li].units=merged;
  ceState.sel=null;
  ceRender();
  toast('Espacios recortados en esa línea');
}

// Fijar cursor de inserción en posición
function ceSetCursor(li, afterUi){
  ceCursor = {li, afterUi};
  ceState.sel = null; // deseleccionar nota si había una
  ceRender();
}

function ceSelNote(li,ui){
  ceCursor=null; // limpiar cursor al seleccionar nota
  ceState.sel={li,ui};
  ceRender();
}
function ceDesel(){
  ceState.sel=null;
  ceRender();
}

// ── Repeat automático al mantener pulsado ◀▶ ──
let _moveTimer=null;
function ceMoveRepeatStart(dir,e){
  e.preventDefault();
  ceMoveNote(dir); // primer movimiento inmediato
  _moveTimer=setInterval(()=>ceMoveNote(dir),120);
}
function ceMoveRepeatStop(){
  if(_moveTimer){ clearInterval(_moveTimer); _moveTimer=null; }
}
// Red de seguridad: ceRender() reconstruye los botones ◀▶ en cada tick,
// así que el mouseup/mouseleave del propio botón puede perderse (el
// elemento sobre el que estaba el cursor ya no existe cuando el navegador
// dispara el evento) y el setInterval se queda corriendo indefinidamente.
// Escuchamos a nivel de document/window, que nunca se destruye, como respaldo.
document.addEventListener('mouseup', ceMoveRepeatStop);
document.addEventListener('mouseleave', ceMoveRepeatStop);
window.addEventListener('blur', ceMoveRepeatStop);
document.addEventListener('touchend', ceMoveRepeatStop);
document.addEventListener('touchcancel', ceMoveRepeatStop);

function ceDelNote(){
  if(!ceState.sel) return;
  const {li,ui}=ceState.sel;
  const units=ceState.lines[li].units;
  const u=units[ui];
  if(!u||u.type!=='note') return;
  const disp=u.note+(u.minor?'m':'')+(u.seventh?'7':'');
  if(!confirm('¿Eliminar la nota "'+disp+'"?')) return;
  // Eliminar la nota y fusionar espacios adyacentes si los hay
  units.splice(ui,1);
  // Si quedan dos espacios consecutivos, fusionarlos
  if(ui>0&&ui<units.length&&units[ui-1].type==='space'&&units[ui].type==='space'){
    units[ui-1]={...units[ui-1],content:units[ui-1].content+units[ui].content};
    units.splice(ui,1);
  }
  ceState.sel=null;
  ceRender();
}

// Tecla Delete/Supr elimina la nota seleccionada
document.addEventListener('keydown', function(e){
  if((e.key==='Delete'||e.key==='Backspace')&&ceState.sel){
    const wrap=document.getElementById('ce-wrap');
    if(!wrap||!wrap.contains(document.activeElement)||document.activeElement.tagName==='INPUT') return;
    e.preventDefault();

});

function ceChangeMinor(isMinor){

function ceMoveNote(dir){
  if(!ceState.sel) return;
  const {li,ui}=ceState.sel;
  const units=ceState.lines[li].units;
  const note=units[ui];
  if(!note||note.type!=='note') return;

  if(dir===1){
    // ── Mover DERECHA: quitar 1 char del espacio derecho, añadir al izquierdo ──
    // Si no hay espacio a la derecha o está vacío, crearlo para poder seguir moviendo
    const rIdx=ui+1;
    if(rIdx>=units.length||units[rIdx].type!=='space'){
      units.push({type:'space',content:''});
    }
    // Reducir espacio derecho en 1
    units[rIdx]={...units[rIdx], content:units[rIdx].content.slice(1)};
    // Ampliar espacio izquierdo en 1
    const lIdx=ui-1;
    if(lIdx>=0&&units[lIdx].type==='space'){
      units[lIdx]={...units[lIdx], content:units[lIdx].content+' '};
    } else {
      units.splice(ui,0,{type:'space',content:' '});
      ceState.sel={li,ui:ui+1};
    }
  } else {
    // ── Mover IZQUIERDA: quitar 1 char del espacio izquierdo, añadir al derecho ──
    const lIdx=ui-1;
    if(lIdx<0||units[lIdx].type!=='space'||units[lIdx].content.length===0) return;
    // Reducir espacio izquierdo en 1
    units[lIdx]={...units[lIdx], content:units[lIdx].content.slice(0,-1)};
    // Ampliar espacio derecho en 1
    const rIdx=ui+1;
    if(rIdx<units.length&&units[rIdx].type==='space'){
      units[rIdx]={...units[rIdx], content:' '+units[rIdx].content};
    } else {
      units.splice(ui+1,0,{type:'space',content:' '});
    }
    // La nota NO cambia de índice — el espacio izquierdo se acortó, la nota sigue en ui
  }

  ceRender();
}

function ceAddNote(li){
  const inp=document.getElementById(`ce-nadd-${li}`);
  const val=inp.value.trim(); if(!val) return;
  const parts=val.split(/\s+/);
  let noteStr=parts[0];
  // fusión manual "Fa #" → "Fa#"
  if((parts[1]==='#'||parts[1]==='b')&&isNoteStr(noteStr+parts[1])){
    noteStr=noteStr+parts[1]; parts.splice(1,1);
  }
  // admitir también el acorde pegado, p.ej. "La7", "lam", "fa#m7"
  if(!isNoteStr(noteStr)){
    const expanded = expandFusedToken(noteStr);
    if(expanded.length>1 && isNoteStr(expanded[0])){
      parts.splice(1,0,...expanded.slice(1));
      noteStr = expanded[0];
    }
  }
  const rest=parts.slice(1).map(p=>p.toLowerCase());
  const minor=rest.includes('m');
  const seventh=rest.includes('7');
  if(!isNoteStr(noteStr)){alert('"'+noteStr+'" no es una nota reconocida');return;}
  const units=ceState.lines[li].units;
  const newUnit={type:'note',note:noteStr,minor,seventh};

  // Determinar posición de inserción
  let insertAt; // índice en units donde se insertará la nota
  if(ceCursor && ceCursor.li===li){
    // Cursor de inserción activo: insertar después de afterUi
    insertAt = ceCursor.afterUi + 1; // +1 porque splice inserta antes del índice
    // Ajustar: afterUi es el índice del token de espacio tras el que va el cursor
    // Necesitamos separar ese espacio en dos partes si el cursor está en medio
    // Por simplicidad: insertamos la nota justo después del token apuntado
    const after = ceCursor.afterUi; // índice del token espacio
    if(after >= 0 && after < units.length && units[after].type==='space'){
      // Dividir el espacio en dos mitades y poner la nota en medio
      const sp = units[after].content;
      // Usamos la mitad como separación (mínimo 1 espacio a cada lado)
      const half = Math.floor(sp.length/2);
      const left = sp.slice(0,half) || '';
      const right = sp.slice(half) || '';
      const replacement = [];
      if(left) replacement.push({type:'space',content:left});
      replacement.push(newUnit);
      if(right) replacement.push({type:'space',content:right});
      units.splice(after,1,...replacement);
    } else {
      // Insertar directamente después de afterUi
      const pos = Math.min(after+1, units.length);
      if(pos>0 && pos<=units.length && units[pos-1].type!=='space')
        units.splice(pos,0,{type:'space',content:' '});
      units.splice(Math.min(after+1,units.length),0,newUnit);
    }
    ceCursor=null;
  } else if(ceState.sel && ceState.sel.li===li){
    // Nota seleccionada: insertar justo después de ella
    const afterSel = ceState.sel.ui+1;
    if(afterSel<units.length && units[afterSel].type!=='space')
      units.splice(afterSel,0,{type:'space',content:' '});
    units.splice(afterSel,0,newUnit);
  } else {
    // Al final
    if(units.length && units[units.length-1].type!=='space')
      units.push({type:'space',content:' '});
    units.push(newUnit);
  }

  inp.value=''; ceRender();
}

function ceAddSpace(li){
  const units=ceState.lines[li].units;
  if(units.length&&units[units.length-1].type==='space'){
    units[units.length-1].content+=' ';
  } else {
    units.push({type:'space',content:' '});
  }
  ceRender();
}

function ceAddLine(){
  const antCount=ceState.antCount;
  // Añadir al final del salmo
  ceState.lines.push({units:[],text:''});
  ceRender();
}

function ceDelLine(li){
  if(ceState.sel&&ceState.sel.li===li) ceState.sel=null;
  else if(ceState.sel&&ceState.sel.li>li) ceState.sel.li--;
  ceState.lines.splice(li,1);
  if(li<ceState.antCount) ceState.antCount=Math.max(0,ceState.antCount-1);
  ceRender();
  ceUpdNotebar();
}

// ─── CALENDARIO LITÚRGICO (España) ──────────────────────────────────────────
// Referencia de ciclos: el año litúrgico que comenzó en Adviento de 2025 es ciclo A.
// Particularidades España: Epifanía el 6 de enero; Ascensión y Corpus Christi
// trasladados al domingo; la Inmaculada (8 dic) prevalece sobre el domingo de Adviento.

function mkDate(y,m,d){ return new Date(y, m, d, 12); } // mediodía para evitar líos de DST
function addDays(dt,n){ const d = new Date(dt); d.setDate(d.getDate()+n); return d; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function diffWeeks(a,b){ return Math.round((a-b)/(7*24*3600*1000)); }

// Computus de la Pascua (algoritmo de Meeus/Butcher, calendario gregoriano)
function easterDate(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return mkDate(y, mo-1, da);
}

// Primer domingo de Adviento del año litúrgico Y (cae entre el 27-nov y el 3-dic de Y)
function advent1(Y){
  const xmas = mkDate(Y,11,25);
  const dow = xmas.getDay();
  const advent4 = addDays(xmas, -(dow===0?7:dow));
  return addDays(advent4, -21);
}

// Ciclo del año litúrgico que empieza en Adviento del año Y (Adviento 2025 → A)
function cicloFor(litY){
  return ['A','B','C'][(((litY-2025)%3)+3)%3];
}

// Celebración dominical (o solemnidad que prevalece) para un domingo dado.
// Devuelve {ciclo, tiempo, dia, keys[]} donde keys son términos de búsqueda en la BD.
function celebrationFor(sun){
  const y = sun.getFullYear();
  const litY = (sun >= advent1(y)) ? y : y-1;
  const ciclo = cicloFor(litY);
  const md = (sun.getMonth()+1)*100 + sun.getDate();

  // Solemnidades de fecha fija que prevalecen sobre el domingo (España)
  if(md===202)  return {ciclo, tiempo:'Propio de los Santos', dia:'Presentación del Señor', keys:['presentacion']};
  if(md===1101) return {ciclo, tiempo:'Propio de los Santos', dia:'Todos los Santos', keys:['todos los santos']};
  if(md===1208) return {ciclo, tiempo:'Propio de los Santos', dia:'La Inmaculada Concepción', keys:['inmaculada']};

  const adv1 = advent1(litY);
  for(let i=0;i<4;i++) if(sameDay(sun, addDays(adv1, i*7)))
    return {ciclo, tiempo:'Adviento', dia:'Domingo '+(i+1), keys:[]};

  // Navidad y su octava
  if(sun.getFullYear()===litY && sun.getMonth()===11){
    if(sun.getDate()===25) return {ciclo, tiempo:'Navidad', dia:'Misa del día', keys:['misa del dia']};
    if(sun.getDate()>=26)  return {ciclo, tiempo:'Navidad', dia:'Sagrada Familia', keys:['octava','sagrada familia']};
  }
  if(sun.getFullYear()===litY+1 && sun.getMonth()===0){
    const d = sun.getDate();
    if(d===1)          return {ciclo, tiempo:'Navidad', dia:'1 de enero (Santa María, Madre de Dios)', keys:['1 de enero']};
    if(d>=2 && d<=5)   return {ciclo, tiempo:'Navidad', dia:'2º domingo después de Navidad', keys:['despues de navidad']};
    if(d===6)          return {ciclo, tiempo:'Navidad', dia:'Epifanía del Señor', keys:['epifania']};
    if(d>=7 && d<=13)  return {ciclo, tiempo:'Navidad', dia:'Bautismo del Señor', keys:['bautismo']};
  }

  const E = easterDate(litY+1);
  for(let i=1;i<=5;i++) if(sameDay(sun, addDays(E, -49+7*i)))
    return {ciclo, tiempo:'Cuaresma', dia:'Domingo '+i, keys:[]};
  if(sameDay(sun, addDays(E,-7))) return {ciclo, tiempo:'Semana Santa', dia:'Domingo de Ramos', keys:['ramos']};
  if(sameDay(sun, E))             return {ciclo, tiempo:'Semana Santa', dia:'Domingo de Resurrección', keys:['resurreccion']};
  for(let i=2;i<=6;i++) if(sameDay(sun, addDays(E, 7*(i-1))))
    return {ciclo, tiempo:'Pascua', dia:'Domingo '+i, keys:[]};
  if(sameDay(sun, addDays(E,42))) return {ciclo, tiempo:'Pascua', dia:'Ascensión del Señor', keys:['ascension','domingo 7']};
  if(sameDay(sun, addDays(E,49))) return {ciclo, tiempo:'Pascua', dia:'Pentecostés', keys:['pentecostes']};
  if(sameDay(sun, addDays(E,56))) return {ciclo, tiempo:'Tiempo Ordinario', dia:'Santísima Trinidad', keys:['trinidad']};
  if(sameDay(sun, addDays(E,63))) return {ciclo, tiempo:'Tiempo Ordinario', dia:'Corpus Christi', keys:['corpus']};

  // Tiempo Ordinario antes de Cuaresma: el domingo siguiente al Bautismo es el Domingo 2
  const jan7 = mkDate(litY+1, 0, 7);
  const bautismo = addDays(jan7, (7 - jan7.getDay()) % 7);
  const ash = addDays(E, -46);
  if(sun > bautismo && sun < ash){
    const n = 1 + diffWeeks(sun, bautismo);
    return {ciclo, tiempo:'Tiempo Ordinario', dia:'Domingo '+n, keys:[]};
  }
  // Tiempo Ordinario tras Pentecostés: se numera hacia atrás desde Cristo Rey (Domingo 34)
  const adv1next = advent1(litY+1);
  const cristoRey = addDays(adv1next, -7);
  if(sun > addDays(E,63) && sun < adv1next){
    const n = 34 - diffWeeks(cristoRey, sun);
    const isCR = sameDay(sun, cristoRey);
    return {ciclo, tiempo:'Tiempo Ordinario', dia:'Domingo '+n+(isCR?' (Cristo Rey)':''), keys: isCR?['cristo rey','domingo 34']:[]};
  }
  return {ciclo, tiempo:'', dia:'(sin determinar)', keys:[]};
}

// Busca en SALMOS la entrada que corresponde a la celebración calculada.
function normTxt(t){ return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function findSalmoFor(cel){
  const nd = normTxt(cel.dia);
  const domMatch = nd.match(/^domingo (\d+)/);
  const scorers = [];
  // 1: mismo ciclo y mismo tiempo; 2: mismo tiempo cualquier ciclo (fiestas fijas guardadas en A)
  for(const anyCiclo of [false, true]){
    for(const s of SALMOS){
      if(!anyCiclo && s.ciclo !== cel.ciclo) continue;
      if(cel.tiempo && normTxt(s.tiempo) !== normTxt(cel.tiempo)) continue;
      const sd = normTxt(s.dia);
      let hit = false;
      if(sd === nd) hit = true;
      else if(domMatch && new RegExp('^domingo\\s+'+domMatch[1]+'\\b').test(sd)) hit = true;
      else if(cel.keys.some(k => sd.includes(normTxt(k)))) hit = true;
      if(hit) return s;
    }
  }
  return null;
}

const MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function openSundays(){
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  let d = addDays(hoy, (7 - hoy.getDay()) % 7); // hoy si es domingo, si no el próximo
  const rows = [];
  for(let i=0;i<8;i++){
    const sun = addDays(d, i*7);
    const cel = celebrationFor(sun);
    const s = findSalmoFor(cel);
    const esHoy = sameDay(sun, hoy);
    let badge, cls, onclick;
    if(!s){ badge='No en la BD'; cls='missing'; onclick=''; }
    else if(!hasChords(s)){ badge='Sin acordes'; cls='nonotes'; onclick=`onclick="openSundayEntry(${s.id})"`; }
    else { badge='♪ Salmo '+s.numero; cls='ok'; onclick=`onclick="openSundayEntry(${s.id})"`; }
    rows.push(`<div class="sun-row ${s?'':'disabled'} ${esHoy?'sun-today':''}" ${onclick}>
      <div class="sun-date">
        <div class="d1">${sun.getDate()} ${MESES_ES[sun.getMonth()]}</div>
        <div class="d2">${esHoy?'HOY':sun.getFullYear()}</div>
      </div>
      <div class="sun-info">
        <div class="sun-cel">${escHtml(cel.dia)}</div>
        <div class="sun-sub">${escHtml(cel.tiempo)} · Ciclo ${cel.ciclo}${s?' · '+escHtml(s.dia):''}</div>
      </div>
      <span class="sun-badge ${cls}">${badge}</span>
    </div>`);
  }
  document.getElementById('sundaysList').innerHTML = rows.join('');
  document.getElementById('sundaysModal').classList.add('open');
}
function openSundayEntry(id){
  document.getElementById('sundaysModal').classList.remove('open');
  openModal(id);
}
